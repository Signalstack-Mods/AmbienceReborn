; AmbienceReborn configuration
; Lines starting with ; or # are comments.
; Times are in milliseconds. 1000 ms = 1 second.

[General]
; Master on/off switch for the whole ambience system.
Enabled=true

; Adds extra editor/debug actions to the LemonUI menu.
; Keep this false for normal gameplay/release builds.
Debug=false

; Shows a texture-dictionary banner at the top of the LemonUI editor menu.
; For a custom image, stream a .ytd and set these to its texture dictionary/name.
EnableEditorBanner=true
EditorBannerDictionary=commonmenu
EditorBannerTexture=interaction_bgd

[Keybinds]
; Opens/closes the in-game AmbienceReborn editor menu.
ToggleEditor=F10

; Reserved for future shortcut combos.
Modifier=ControlKey

[Audio]
; Overall volume multiplier. 1.0 = full volume, 0.5 = half volume.
MasterVolume=1.0

; Allows zones to play sounds listed in NightSounds.
EnableNightAudio=true

; Allows zones to play sounds listed in DaySounds.
EnableDayAudio=true

; Allows occasional zone events like distant sirens and train horns.
EnableRandomEvents=true

; Legacy setting. FadeMs is used for the current fade/crossfade system.
FadeSpeed=0.05

; Fade-in/fade-out/crossfade duration.
FadeMs=1500

; Default ambience delay range for zones that do not override it.
MinDelayMs=18000
MaxDelayMs=45000

; Maximum number of overlapping zones that can play at once.
; Set to 0 for unlimited overlapping zones.
MaxActiveZones=0

[Zones]
; Radius used when creating a new zone from the editor.
DefaultRadius=75

; Draw zone radius circles on the minimap when enabled from the editor.
; Keep this false while testing crashes. Enable from the menu only when mapping.
ShowZoneBlipsOnStartup=true

; Draw a GTA GPS-style line for selected route zones.
; This uses map natives. If GTA crashes while mapping, set this false.
EnableGpsRoutePreview=true

; Minimum time between automatic minimap overlay rebuilds.
; Higher values reduce native map calls and improve stability.
MapRefreshMs=30000

; Saves zone edits immediately when changed in the editor.
AutoSave=true

; Horizontal nudge distance for moving selected zones in the editor.
MoveStep=10

; Vertical nudge distance for moving selected zones up/down in the editor.
VerticalMoveStep=2

; Distance between automatically recorded route points.
; Larger values create fewer points and cleaner JSON.
RoutePointSpacing=45

; Width change applied by the route left/right width editor controls.
RouteWidthStep=25
